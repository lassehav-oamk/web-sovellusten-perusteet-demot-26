
name: Build and deploy Verkkokauppa-demo to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # Build React frontend
      - name: Install client dependencies
        working-directory: verkkokauppa-demo/client
        run: npm ci

      - name: Build React client
        working-directory: verkkokauppa-demo/client
        run: npm run build

      # Prepare Express backend
      - name: Install server dependencies
        working-directory: verkkokauppa-demo/server
        run: npm ci --omit=dev

      # Assemble deployment package
      - name: Prepare deployment
        run: |
          mkdir -p deploy/server
          mkdir -p deploy/client/dist

          cp -R verkkokauppa-demo/server/. deploy/server/
          cp -R verkkokauppa-demo/client/dist/. deploy/client/dist/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E946139B9ACA4FF286A3B8211BC66C85 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C586C896B3BB40A493B1CFEE8A2889DD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_26CD6E8EC23A4EC58FECE986B0C10F50 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Verkkokauppa-demo'
          slot-name: 'Production'
          package: .
